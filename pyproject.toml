[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "aws-ssm-bridge"
version = "0.1.0"
description = "Python bindings for AWS Systems Manager Session Manager protocol"
authors = [
    {name = "AWS SSM Bridge Contributors"}
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT OR Apache-2.0"}
keywords = ["aws", "ssm", "session-manager", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/example/aws-ssm-bridge"
Repository = "https://github.com/example/aws-ssm-bridge"
Documentation = "https://github.com/example/aws-ssm-bridge/docs"

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "aws_ssm_bridge._internal"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
