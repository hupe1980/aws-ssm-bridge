[package]
name = "aws-ssm-bridge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1.7"
serde_json = "1.0"

[dependencies.aws-ssm-bridge]
path = ".."
default-features = false

[[bin]]
name = "fuzz_binary_protocol"
path = "fuzz_targets/binary_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_acknowledge"
path = "fuzz_targets/acknowledge.rs"
test = false
doc = false
bench = false
