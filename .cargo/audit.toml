# cargo-audit configuration.
#
# There is deliberately no `ignore` list. The tree previously carried
# rustls-webpki 0.101.x with three unpatched advisories, pulled in by the AWS
# SDK crates' default `rustls` feature (aws-smithy-http-client's legacy
# hyper-0.14 stack). Cargo.toml now disables those default features, so the
# vulnerable code is not in the build at all rather than ignored in a config
# file. If an advisory reappears, fix or vendor it — do not add it here without
# a written justification and a link to the upstream issue.
[advisories]
ignore = []
