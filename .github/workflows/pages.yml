name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default; the deploy job asks for exactly what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.2"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
          zola --version

      # Catches internal links to pages that no longer exist. A docs site that
      # ships dead links is worse than one that refuses to build.
      #
      # External links are skipped deliberately: they fail for reasons that have
      # nothing to do with this repository — rate limits, sites that block CI
      # ranges — and a docs deploy that breaks when someone else's server has a
      # bad day is a deploy nobody trusts.
      - name: Check internal links and templates
        working-directory: site
        run: zola check --skip-external-links

      # base_url comes from config.toml, which already points at the Pages URL.
      - name: Build
        working-directory: site
        run: zola build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    name: Deploy
    # Pull requests are built and link-checked but never published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
