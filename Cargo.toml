[package]
name = "aws-ssm-bridge"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
authors = ["hupe1980"]
license = "MIT"
repository = "https://github.com/hupe1980/aws-ssm-bridge"
homepage = "https://hupe1980.github.io/aws-ssm-bridge/"
description = "Rust library implementing AWS Systems Manager Session Manager protocol"
keywords = ["aws", "ssm", "session-manager", "async"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[lib]
name = "aws_ssm_bridge"
crate-type = ["rlib", "cdylib"]

[features]
default = ["interactive"]
# Core features
# interactive = terminal handling for interactive shells
interactive = []
# python = Python bindings via PyO3
python = ["dep:pyo3", "dep:pyo3-async-runtimes", "dep:tracing-subscriber"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec"] }

# AWS SDK (with SSO/login support)
aws-config = { version = "1.5", features = ["behavior-version-latest", "sso", "credentials-login"] }
aws-sdk-ssm = "1.45"
aws-smithy-types = "1.2"
aws-smithy-runtime-api = "1.7"

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tungstenite = "0.26"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Utilities
bytes = "1.7"
futures = "0.3"
pin-project-lite = "0.2"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.8"
url = "2.5"  # URL parsing and validation
zeroize = { version = "1", features = ["derive"] }  # Zero-on-drop for secrets (token_value)

# Terminal handling
crossterm = "0.28"

# Python bindings (optional)
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"], optional = true }
pyo3-async-runtimes = { version = "0.24", features = ["tokio-runtime"], optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mockall = "0.13"
tokio-test = "0.4"
futures-util = "0.3"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
proptest = "1.4"
test-case = "3.3"

[[example]]
name = "interactive_shell"
required-features = ["interactive"]

[[example]]
name = "metrics_session"

[[example]]
name = "port_forwarding"

[[example]]
name = "reconnecting"

[[example]]
name = "session_pool"

[[example]]
name = "shell_session"

[[bench]]
name = "throughput"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Only enable useful lints, disable overly pedantic ones
# Correctness
all = { level = "warn", priority = -1 }
# Style improvements (selective)
unnested_or_patterns = "allow"
match_same_arms = "allow"
redundant_else = "allow"
# Pedantic (disable most, too noisy for production code)
pedantic = { level = "allow", priority = -1 }
# Nursery (disable, unstable)
nursery = { level = "allow", priority = -1 }
